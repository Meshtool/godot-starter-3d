name: Build Web Export

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 13 * * *"   # daily refresh so the skyline tracks the repos
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repo-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Mesh Tag trust boundary
        run: |
          python -m pip install -r requirements-dev.txt
          python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Refresh repos.json, keep snapshot on error
        run: python3 tools/fetch_repos.py && python3 tools/fetch_desk.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEVDESK_EFFORT_URL: ${{ vars.DEVDESK_EFFORT_URL }}
      - uses: actions/upload-artifact@v4
        with:
          name: repo-data
          path: |
            data/repos.json
            data/desk.json
          retention-days: 1

  build:
    needs: repo-data
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Pull fresh repo data
        uses: actions/download-artifact@v4
        with:
          name: repo-data
          path: data

      - name: Install Web export templates
        run: |
          apt-get update && apt-get install -y curl unzip python3
          mkdir -p /github/home/.local/share/godot/export_templates/4.3.stable
          cd /tmp
          curl -fL -o export_templates.tpz https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          unzip -o export_templates.tpz -d /tmp/templates
          find /tmp/templates -name "web_*.zip" -exec cp {} /github/home/.local/share/godot/export_templates/4.3.stable/ \;
          ls -la /github/home/.local/share/godot/export_templates/4.3.stable/

      - name: Bind build and test replay
        run: |
          python3 tools/write_build_manifest.py
          godot --headless --editor --import
          godot --headless --script tests/run_model_test.gd
          godot --headless --script tests/game_flow_test.gd
          godot --headless --script tests/portal_flow_test.gd

      - name: Export Web build
        run: |
          mkdir -p build/web
          godot --headless --export-release "Web" build/web/index.html
          test -f build/web/index.html

      - name: Upload web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web/
          retention-days: 7

      - name: Deploy to itch.io
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && env.BUTLER_CREDENTIALS != ''
        run: butler push build/web meshtool/godot-starter-3d:web
        env:
          BUTLER_CREDENTIALS: ${{ secrets.BUTLER_CREDENTIALS }}
          BUTLER_API_KEY: ${{ secrets.BUTLER_CREDENTIALS }}
