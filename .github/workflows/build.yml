name: Build Web Export

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Web export templates
        run: |
          apt-get update && apt-get install -y curl unzip
          mkdir -p /github/home/.local/share/godot/export_templates/4.3.stable
          cd /tmp
          curl -fL -o export_templates.tpz https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz
          unzip -o export_templates.tpz -d /github/home/.local/share/godot/export_templates/4.3.stable/
          ls -la /github/home/.local/share/godot/export_templates/4.3.stable/

      - name: Export Web build
        run: |
          godot --headless --export-release "Web" build/web/index.html

      - name: Upload web build artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-build
          path: build/web/
          retention-days: 7

      - name: Deploy to itch.io
        if: success()
        run: |
          butler push build/web Meshtool/godot-starter-3d:web
        env:
          BUTLER_CREDENTIALS: ${{ secrets.BUTLER_CREDENTIALS }}